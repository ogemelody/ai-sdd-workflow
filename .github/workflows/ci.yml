
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate engineering starter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            "AGENTS.md"
            ".specify/memory/constitution.md"
            "docs/testing-strategy.md"
            "docs/testing-checklist.md"
            "specs/_template/spec.md"
            "specs/_template/plan.md"
            "specs/_template/tasks.md"
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty: $file"
              exit 1
            fi
          done


      - name: Check whitespace errors
        shell: bash
        run: |
          git diff --check
      
